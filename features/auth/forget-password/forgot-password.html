<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hot Meal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Patua+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./forgot-password.css" />
  </head>
  <body>
    <script src="../../../config.js"></script>

    <main class="main">
      <div class="forgotPass-main">
        <h1 class="page-title">Reset Password</h1>

        <p class="subtitle">
          Enter your email and we'll send you a reset link.
        </p>

        <form id="forgotPasswordForm" novalidate>
          <div class="field-group">
            <input
              type="email"
              id="email"
              class="input-field"
              placeholder="Enter email"
              autocomplete="email"
              required
            />
            <p class="field-error" id="emailError"></p>
          </div>

          <button type="submit" class="btn-continue" id="continueBtn">
            <span class="btn-label" id="btnLabel">Reset my Password</span>
            <span class="btn-spinner" id="btnSpinner"></span>
          </button>
        </form>

        <p class="signup-prompt">
          <a href="../login/login.html" class="signup-link"
            >← Back to Sign In</a
          >
        </p>
      </div>
    </main>

    <script src="./forgot-password.js"></script>
  </body>
</html>
