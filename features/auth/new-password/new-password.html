<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hot Meal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Patua+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./new-password.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-logo">
        <img
          src="../../../images/HOTMEAL-23 - 1.svg"
          alt="App Logo"
          class="logo-img"
        />
      </div>
    </nav>
    <main class="main">
      <div class="forgotPass-main">
        <h1 class="page-title">Reset Password</h1>

        <form id="forgotPasswordForm" novalidate>
          <!-- Password field -->
          <div class="field-group">
            <div class="pass-input">
              <input
                type="password"
                id="password"
                class="input-field"
                placeholder="Enter password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="eye-toggle"
                id="eyeToggle"
                title="Show/hide password"
              >
                <img src="../../../images/show.png" alt="show" />
                <img src="../../../images/hide.png" alt="hide" />
              </button>
            </div>
            <p class="field-error" id="passwordError"></p>
          </div>

          <!-- reset password -->
          <button type="submit" class="btn-continue" id="continueBtn">
            <span class="btn-label" id="btnLabel">Reset my Password</span>
            <span class="btn-spinner" id="btnSpinner"></span>
          </button>
        </form>
      </div>
    </main>
    <script src="./new-password.js"></script>
  </body>
</html>
