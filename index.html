<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodDash — Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="form-card">
        <h2 class="card-title">Sign in</h2>
        <p class="card-subtitle">Sign in to your account to continue</p>

        <!-- Error Message -->
        <div class="error-msg" id="errorMsg">
          ⚠️ <span id="errorText"></span>
        </div>

        <!-- Form -->
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email address</label>
            <div class="input-wrap">
              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
              <button
                type="button"
                class="toggle-pass"
                onclick="togglePassword()"
              >
                👁️
              </button>
            </div>
          </div>

          <div class="form-footer">
            <label class="remember-me">
              <input type="checkbox" /> Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <!-- Social Login -->
          <div class="social-btns">
            <button class="social-btn">Google</button>
            <button class="social-btn">Apple</button>
            <button class="social-btn">Facebook</button>
          </div>

          <button type="submit" class="btn-primary" id="loginBtn">
            <span class="btn-text">Sign In →</span>
            <div class="spinner"></div>
          </button>
        </form>

        <p class="bottom-link">
          Don't have an account? <a href="#">Sign up free</a>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
